name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Knip (report only)
        run: npm run knip -- --no-exit-code --reporter symbols --reporter github-actions
      - name: Knip production (report only)
        run: npm run knip:production -- --no-exit-code --reporter symbols --reporter github-actions
      - run: npm run check-format
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --testTimeout=20000
      - run: npm run build
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Validate Docker Compose configuration
        run: |
          OWNER_TOKEN=012345678901234567890123456789 \
          BROWSER_SECRET=abcdefghijabcdefghijabcdefghij \
          OBSCURA_CDP_TOKEN=0123456789012345678901234567890123456789 \
          docker compose config --quiet
      - name: Build application image for amd64 and arm64
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --target app \
            --output=type=oci,dest=/tmp/opendots-app.oci.tar .
      - name: Build browser gateway image for amd64 and arm64
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --target browser \
            --output=type=oci,dest=/tmp/opendots-browser.oci.tar .
