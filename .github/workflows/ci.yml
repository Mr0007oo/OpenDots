name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Knip (report only)
        run: npm run knip -- --no-exit-code --reporter symbols --reporter github-actions
      - name: Knip production (report only)
        run: npm run knip:production -- --no-exit-code --reporter symbols --reporter github-actions
      - run: npm run check-format
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --testTimeout=20000
      - run: npm run build
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate Docker Compose configuration
        run: |
          OWNER_TOKEN=012345678901234567890123456789 \
          BROWSER_SECRET=abcdefghijabcdefghijabcdefghij \
          OBSCURA_CDP_TOKEN=0123456789012345678901234567890123456789 \
          docker compose config --quiet
      - name: Build and push application image for amd64 and arm64
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --target app \
            --tag ghcr.io/${REPO}/app:latest \
            --tag ghcr.io/${REPO}/app:${{ github.sha }} \
            --push .
      - name: Build and push browser gateway image for amd64 and arm64
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --target browser \
            --tag ghcr.io/${REPO}/browser:latest \
            --tag ghcr.io/${REPO}/browser:${{ github.sha }} \
            --push .
      - name: Make Docker packages public
        run: |
          echo "Updating package visibility to public..."
          for PACKAGE in app browser; do
            curl -X PATCH \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              https://api.github.com/user/packages/container/${{ github.event.repository.name }}%2F${PACKAGE}/visibility \
              -d '{"visibility":"public"}' || true
          done
      - name: Echo Image URLs and Pull Commands
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "=========================================="
          echo "🚀 Docker Images Published & Made Public!"
          echo "=========================================="
          echo ""
          echo "📦 Application Image URL:"
          echo "  ghcr.io/${REPO}/app:latest"
          echo "  ghcr.io/${REPO}/app:${{ github.sha }}"
          echo ""
          echo "📥 Application Pull Command:"
          echo "  docker pull ghcr.io/${REPO}/app:latest"
          echo ""
          echo "🌐 Upstream Browser Image Base:"
          echo "  h4ckf0r0day/obscura@sha256:76522dd288b0c0186b360fd6e6133ef55908e1fc3b9c4b7ad6240bf8682d998c"
          echo ""
          echo "🌐 Browser Gateway Image URL (Published):"
          echo "  ghcr.io/${REPO}/browser:latest"
          echo "  ghcr.io/${REPO}/browser:${{ github.sha }}"
          echo ""
          echo "📥 Browser Gateway Pull Command:"
          echo "  docker pull h4ckf0r0day/obscura@sha256:76522dd288b0c0186b360fd6e6133ef55908e1fc3b9c4b7ad6240bf8682d998c"
          echo "=========================================="
